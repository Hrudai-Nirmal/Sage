[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-core"
version = "0.1.0"
description = "Local, approval-gated personal operations core for Sage."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "trafilatura>=2.2,<2.3",
  "uvicorn[standard]>=0.38,<0.39",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
