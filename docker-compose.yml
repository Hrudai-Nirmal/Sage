# Docker owns n8n orchestration; native launchd owns Core and Apple Silicon model processes.
# Core and host workers must share one macOS SQLite locking domain.
name: sage

services:
  n8n:
    image: n8nio/n8n:2.37.10
    env_file:
      - ${SAGE_N8N_ENV_FILE:?Set SAGE_N8N_ENV_FILE in .env}
      - ${SAGE_TELEGRAM_ENV_FILE:?Set SAGE_TELEGRAM_ENV_FILE in .env}
      - ${SAGE_MODEL_SERVER_ENV_FILE:?Set SAGE_MODEL_SERVER_ENV_FILE in .env}
      - ${SAGE_GOOGLE_ENV_FILE:?Set SAGE_GOOGLE_ENV_FILE in .env}
    environment:
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      # The local poller reads only its private runtime values; no secret is versioned in workflows.
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: "0"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: "1"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: "1"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Preserve the deployed workflow hostname while source workflows migrate to the explicit alias.
      - "sage-core:host-gateway"
    restart: unless-stopped
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-data:
